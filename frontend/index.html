<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'self'; frame-ancestors 'none';" />
  <meta name="description" content="BRD Specialist — AI-assisted generation of Business Requirements Documents from data evidence." />
  <meta name="referrer" content="no-referrer" />
  <meta name="color-scheme" content="light" />
  <meta property="og:title" content="BRD Specialist" />
  <meta property="og:description" content="Generate Business Requirements Documents with evidence-grounded AI agents." />
  <meta property="og:type" content="website" />
  <title>BRD Specialist</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2'%3E%3Cpath d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'/%3E%3Cpolyline points='14 2 14 8 20 8'/%3E%3Cline x1='16' y1='13' x2='8' y2='13'/%3E%3Cline x1='16' y1='17' x2='8' y2='17'/%3E%3Cpolyline points='10 9 9 9 8 9'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/style.css?v=3" />
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <h1>BRD Specialist</h1>
        </div>
        <button class="new-chat-btn" id="new-chat-btn">+ New BRD</button>
      </div>
      <div class="sidebar-content" id="conversation-list">
        <div class="sidebar-loading">
          <div class="sidebar-skeleton"></div>
          <div class="sidebar-skeleton"></div>
          <div class="sidebar-skeleton"></div>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <button class="menu-btn" id="menu-btn" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>

      <div class="main-scroll" id="main-scroll">
        <div class="content-area" id="content-area" aria-live="polite" aria-relevant="additions text" aria-busy="false">
          <div class="welcome">
            <svg class="welcome-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            <h2>BRD Specialist</h2>
            <p>Describe your requirements and I'll generate a Business Requirements Document</p>
            <div class="welcome-hints">
              <button type="button" class="welcome-hint" data-hint="Fetch records and draft a BRD">Fetch records and draft a BRD</button>
              <button type="button" class="welcome-hint" data-hint="Analyse data and create requirements">Analyse data and create requirements</button>
              <button type="button" class="welcome-hint" data-hint="Review evidence and generate docs">Review evidence and generate docs</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Input bar -->
      <div class="input-bar">
        <div class="input-meta">
          <span class="response-time" id="response-time"></span>
        </div>
        <form id="message-form" class="input-form">
          <textarea
            id="message-input"
            placeholder="Describe your BRD requirements..."
            maxlength="2000"
            rows="2"
          ></textarea>
          <button type="submit" id="send-btn" disabled>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            Send
          </button>
        </form>
      </div>

      <!-- Log panel -->
      <div class="log-panel" id="log-panel">
        <div class="log-panel-header">
          <span class="log-panel-title">Agent Activity</span>
          <button class="log-toggle" id="log-toggle" aria-label="Toggle logs">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
        <div class="log-panel-body" id="log-body"></div>
      </div>
    </main>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <div class="toast-container" id="toast-container"></div>

  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script src="/static/app.js?v=3"></script>
</body>
</html>
