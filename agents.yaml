agents:
  # ── Database agent (custom, backed by Neon Data API) ──────────────────────
  - name: "Database Agent"
    type: custom
    port: 8001
    description: "Full database access: schema inspection, SELECT, INSERT, DELETE queries"
    module: "agents.database_agent"
    factory: "create_agent"
    skills:
      - id: database-ops
        name: Database Operations
        description: "Schema inspection and SQL queries"
        tags: [database, sql]

  # ── Graph agent (multi-step workflow) ─────────────────────────────────────
  - name: "Graph Reviewer"
    type: custom
    port: 8002
    description: "Multi-step reasoning: analyze, implement, review with revision loops"
    module: "agents.graph_reviewer"
    factory: "create_agent"
    skills:
      - id: multi-step-reasoning
        name: Multi-Step Reasoning
        description: "Structured graph workflow with automatic revision cycles"
        tags: [reasoning, analysis, review]

  # ── BRD agent (document generation workflow) ─────────────────────────────
  - name: "BRD Specialist"
    type: custom
    port: 8004
    description: "Creates structured business requirements documents from confirmed evidence summaries"
    module: "agents.brd_specialist"
    factory: "create_agent"
    skills:
      - id: brd-generation
        name: BRD Generation
        description: "Creates business requirements documents from structured evidence"
        tags: [brd, requirements, documentation]

  # ── Swarm agent (autonomous team) ─────────────────────────────────────────
  - name: "Research Team"
    type: custom
    port: 8003
    description: "Collaborative research team: researcher, writer, editor with autonomous handoffs"
    module: "agents.research_team"
    factory: "create_agent"
    skills:
      - id: collaborative-research
        name: Collaborative Research
        description: "Multi-agent research, writing, and editing"
        tags: [research, writing, collaboration]
