agents:
  # ── MCP agent (config-only, no code needed) ───────────────────────────────
  - name: "Database Agent"
    type: mcp
    port: 8001
    description: "Full database access: schema inspection, SELECT, INSERT, DELETE queries"
    mcp_url: "https://mcp.neon.tech/mcp"
    auth:
      type: bearer
      env_var: NEON_API_KEY
    tools: ["get_database_tables", "describe_table_schema", "run_sql"]
    system_prompt: |
      You are DatabaseAgent, a database assistant with full access.

      Use the available MCP tools to inspect schema and execute SQL queries.
      Consider tables from all user-defined schemas.
      Ignore system/internal schemas (pg_catalog, information_schema, etc.).
      Always query the actual database. Never fabricate schema information.

      If an operation fails, report the error clearly and stop.
      Do not retry the same failing operation.
    skills:
      - id: database-ops
        name: Database Operations
        description: "Schema inspection and SQL queries (SELECT, INSERT, DELETE)"
        tags: [database, sql]

  # ── Graph agent (multi-step workflow) ─────────────────────────────────────
  - name: "Graph Reviewer"
    type: custom
    port: 8002
    description: "Multi-step reasoning: analyze, implement, review with revision loops"
    module: "agents.graph_reviewer"
    factory: "create_agent"
    skills:
      - id: multi-step-reasoning
        name: Multi-Step Reasoning
        description: "Structured graph workflow with automatic revision cycles"
        tags: [reasoning, analysis, review]

  # ── Swarm agent (autonomous team) ─────────────────────────────────────────
  - name: "Research Team"
    type: custom
    port: 8003
    description: "Collaborative research team: researcher, writer, editor with autonomous handoffs"
    module: "agents.research_team"
    factory: "create_agent"
    skills:
      - id: collaborative-research
        name: Collaborative Research
        description: "Multi-agent research, writing, and editing"
        tags: [research, writing, collaboration]


  # ── DeepWiki MCP agent ─────────────────────
  - name: "DeepWiki Agent"
    type: mcp
    port: 8004
    description: "Agent with access to DeepWiki for information retrieval and summarization"
    mcp_url: "https://mcp.deepwiki.com/mcp"
    tools: ["read_wiki_structure", "read_wiki_contents", "ask_question"]
    system_prompt: |
      You are DeepWikiAgent, an assistant with access to DeepWiki.

      Use the available MCP tools to search for information and summarize content from DeepWiki.
      Always query DeepWiki for information. Do not fabricate answers.

  # ── Kaggle MCP Agent ─────────────────────────────────────────────────
  - name: "Kaggle Agent"
    type: mcp
    port: 8005
    description: "Agent with access to Kaggle for searching competitions, datasets, notebooks, and models"
    mcp_url: "https://www.kaggle.com/mcp"
    auth:
      type: bearer
      env_var: KAGGLE_KEY
    system_prompt: |
      You are KaggleAgent, an assistant with access to the Kaggle platform.

      Use the available MCP tools to search and explore Kaggle resources:
      competitions, datasets, notebooks/kernels, and models.
      Always query Kaggle for real data. Do not fabricate results.
      When returning results, include relevant metadata like titles, URLs, and descriptions.
    skills:
      - id: kaggle-search
        name: Kaggle Search
        description: "Search and explore Kaggle competitions, datasets, notebooks, and models"
        tags: [kaggle, data-science, machine-learning]