[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "a2a-strands-example"
version = "1.0.0"
description = "Production-grade A2A multi-agent system using Strands Agents SDK"
requires-python = ">=3.11"
dependencies = [
    "strands-agents[a2a,gemini]>=1.32.0,<2.0.0",
    "strands-agents-tools>=0.1.0",
    "a2a-sdk>=0.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "slowapi>=0.1.9",
    "botocore[crt]",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
otel = [
    "strands-agents[otel]>=1.32.0,<2.0.0",
    "opentelemetry-exporter-otlp>=1.29.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "anyio[trio]>=4.0.0",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "types-psycopg2>=2.9.0",
]

# ── Ruff (linting + formatting) ───────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",   # do not perform function calls in argument defaults (FastAPI pattern)
    "UP007",  # X | Y union syntax — keep Optional for clarity
]

[tool.ruff.lint.isort]
known-first-party = ["agents", "common", "db", "mcp_client", "tools"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/", ".venv/"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
