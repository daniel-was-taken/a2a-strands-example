services:
  orchestrator:
    build: .
    command: ["python", "-m", "core.orchestrator"]
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      DATABASE_MODE: "a2a"
      AGENTS_CONFIG: "/app/agents.yaml"
    volumes:
      - ./agents.yaml:/app/agents.yaml:ro
    depends_on:
      - database-agent
      - graph-reviewer
      - research-team
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  database-agent:
    build: .
    command: ["python", "-m", "core.server", "--config", "/app/agents.yaml", "--agent", "Database Agent"]
    env_file: .env
    ports:
      - "8001:8001"
    volumes:
      - ./agents.yaml:/app/agents.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/.well-known/agent-card.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  graph-reviewer:
    build: .
    command: ["python", "-m", "agents.graph_reviewer"]
    env_file: .env
    ports:
      - "8002:8002"
    volumes:
      - ./agents.yaml:/app/agents.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/.well-known/agent-card.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  research-team:
    build: .
    command: ["python", "-m", "agents.research_team"]
    env_file: .env
    ports:
      - "8003:8003"
    volumes:
      - ./agents.yaml:/app/agents.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/.well-known/agent-card.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
